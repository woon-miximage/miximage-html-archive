for(const k of "MFC")D[k].split("\n").forEach((r,i)=>{const[st,t,en,sc,fx,l,s]=r.split("|");items.push({id:k+String(i+1).padStart(2,"0"),k,st:+st,t,en,sc,fx,l,s})});
const text=(e,ref)=>[ref?REF[e.k]:"",THEME,"Scene: "+SC[e.k]+e.sc+".","Mood: "+e.en+".","Effects: "+e.fx+".","Color story: "+CS[e.st-1]+".","Camera: "+L[e.l]+"; framing: "+S[e.s][1]+"; aspect ratio 3:2 landscape.",STYLE,NEG].filter(Boolean).join("\n");
let cur="*",cs="*";
const main=document.getElementById("main"),refBox=document.getElementById("ref"),stg=document.getElementById("stg");
async function copy(t,b){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true}catch(err){
    const x=document.createElement("textarea");x.value=t;x.style.cssText="position:fixed;opacity:0";document.body.appendChild(x);x.select();
    try{ok=document.execCommand("copy")}catch(e2){}x.remove();
  }
  b.dataset.o=b.dataset.o||b.textContent;
  b.textContent=ok?"คัดลอกแล้ว":"คัดลอกไม่ได้ ลองเลือกข้อความเอง";
  setTimeout(()=>{b.textContent=b.dataset.o},1600);
}
const shown=()=>items.filter(e=>(cur==="*"||e.k===cur)&&(cs==="*"||e.st===+cs));
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!=null)n.textContent=txt;return n}
function render(){
  main.textContent="";
  shown().forEach(e=>{
    const c=el("article","card"),top=el("div","top"),h=el("div");
    h.append(el("h2","",e.t),el("div","en",e.en));
    top.append(h,el("span","id",e.id));
    const chips=el("div","chips");
    [ST[e.st-1],L[e.l].split(" ")[0],S[e.s][0],"3:2"].forEach(x=>chips.append(el("span","",x)));
    const pre=el("pre","",text(e,refBox.checked));
    const b=el("button","cp","คัดลอกพรอมต์");
    b.onclick=()=>copy(text(e,refBox.checked),b);
    c.append(top,chips,pre,b);main.append(c);
  });
}
function pick(sel,val,set){document.querySelectorAll(sel).forEach(x=>x.setAttribute("aria-pressed",x.dataset.k===val));set(val);render()}
document.querySelectorAll(".tab.k").forEach(t=>t.onclick=()=>pick(".tab.k",t.dataset.k,v=>cur=v));
["*",1,2,3,4,5,6].forEach(v=>{
  const b=el("button","tab s",v==="*"?"ทุกช่วงเรื่อง":v+" "+ST[v-1]);b.dataset.k=String(v);b.setAttribute("aria-pressed",v==="*");
  b.onclick=()=>pick(".tab.s",String(v),x=>cs=x);stg.append(b);
});
refBox.onchange=render;
const allBtn=document.getElementById("all");
allBtn.onclick=()=>copy(shown().map(e=>"### "+e.id+" "+e.en+"\n"+text(e,refBox.checked)).join("\n\n"),allBtn);
render();
</script>
</body>
